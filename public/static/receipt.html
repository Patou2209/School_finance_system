<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reçu de paiement</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
<link href="/static/css/style.css" rel="stylesheet">
<style>
  body { background: #e2e8f0; }
  .receipt-print-area { width: 380px; margin: 0 auto; }
  @media print {
    @page { size: 100mm 150mm; margin: 4mm; }
    body { background: #fff; }
  }
</style>
</head>
<body class="py-8">
  <div id="toast-container"></div>
  <div class="no-print flex justify-center gap-3 mb-4">
    <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold"><i class="fas fa-print mr-2"></i>Imprimer</button>
    <button onclick="window.close()" class="bg-slate-500 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Fermer</button>
  </div>

  <div id="receipt-container" class="receipt-print-area bg-white border-2 border-dashed border-slate-400 rounded-lg p-5 text-sm">
    <div class="text-center loader"></div>
  </div>

<script src="/static/js/api.js"></script>
<script>
async function loadReceipt() {
  const params = new URLSearchParams(window.location.search)
  const paymentId = params.get('payment_id')
  if (!paymentId) {
    document.getElementById('receipt-container').innerHTML = '<p class="text-center text-red-600">Aucun paiement spécifié</p>'
    return
  }
  try {
    const data = await Api.get(`/api/perception/receipt/${paymentId}`)
    render(data)
  } catch (err) {
    document.getElementById('receipt-container').innerHTML = `<p class="text-center text-red-600">${escapeHtml(err.message)}</p>`
  }
}

function render(data) {
  const { school, payment, fee_amount, total_paid, balance } = data
  const dateObj = new Date(payment.date_paiement + 'T00:00:00')
  const jour = dateObj.toLocaleDateString('fr-FR', { weekday: 'long' })

  document.getElementById('receipt-container').innerHTML = `
    <div class="text-center mb-3">
      <h1 class="font-bold text-base uppercase leading-tight">${escapeHtml(school.name)}</h1>
      ${school.address ? `<p class="text-xs text-slate-500">${escapeHtml(school.address)}</p>` : ''}
      ${school.phone ? `<p class="text-xs text-slate-500">Tél: ${escapeHtml(school.phone)}</p>` : ''}
    </div>
    <div class="text-center border-y-2 border-slate-800 py-1.5 mb-3">
      <p class="font-bold text-sm tracking-wide">REÇU DE PAIEMENT</p>
      <p class="text-xs text-slate-500">N° ${escapeHtml(payment.receipt_number)}</p>
    </div>

    <table class="w-full text-xs mb-3">
      <tr><td class="py-1 text-slate-500 w-28">Année scolaire</td><td class="py-1 font-semibold">: ${escapeHtml(payment.year_label)}</td></tr>
      <tr><td class="py-1 text-slate-500">Élève</td><td class="py-1 font-semibold">: ${escapeHtml(payment.nom)} ${escapeHtml(payment.post_nom)} ${escapeHtml(payment.prenom || '')}</td></tr>
      <tr><td class="py-1 text-slate-500">Classe</td><td class="py-1 font-semibold">: ${escapeHtml(payment.class_name)}</td></tr>
      <tr><td class="py-1 text-slate-500">Trimestre</td><td class="py-1 font-semibold">: ${escapeHtml(payment.trimester_name)}</td></tr>
      <tr><td class="py-1 text-slate-500">Jour et date</td><td class="py-1 font-semibold capitalize">: ${jour}, ${fmtDate(payment.date_paiement)}</td></tr>
    </table>

    <div class="border border-slate-300 rounded-lg p-3 mb-3 space-y-1.5">
      <div class="flex justify-between text-xs"><span class="text-slate-500">Frais du trimestre</span><span class="font-semibold">${fmtMoney(fee_amount, school.currency)}</span></div>
      <div class="flex justify-between text-sm border-t pt-1.5"><span class="font-bold">Montant payé ce jour</span><span class="font-bold text-green-700">${fmtMoney(payment.montant, school.currency)}</span></div>
      <div class="flex justify-between text-xs"><span class="text-slate-500">Total payé (cumul trimestre)</span><span class="font-semibold">${fmtMoney(total_paid, school.currency)}</span></div>
      <div class="flex justify-between text-sm border-t pt-1.5"><span class="font-bold">Dette restante</span><span class="font-bold ${balance > 0 ? 'text-red-700' : 'text-green-700'}">${balance > 0 ? fmtMoney(balance, school.currency) : 'SOLDÉ'}</span></div>
    </div>

    <p class="text-xs text-slate-500 mb-6">Perçu par : <span class="font-semibold text-slate-700">${escapeHtml(payment.percepteur_name)}</span></p>

    <div class="grid grid-cols-2 gap-4 text-center text-xs mt-8">
      <div>
        <div class="border-b border-slate-400 h-10"></div>
        <p class="mt-1 text-slate-500">Sceau de l'école</p>
      </div>
      <div>
        <div class="border-b border-slate-400 h-10"></div>
        <p class="mt-1 text-slate-500">Signature du percepteur</p>
      </div>
    </div>

    <p class="text-center text-[10px] text-slate-400 mt-4">Document généré automatiquement — Plateforme de Gestion Financière Scolaire</p>
  `
}

loadReceipt()
</script>
</body>
</html>
