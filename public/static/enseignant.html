<style>
  body { font-family: 'Figtree', system-ui, sans-serif; color: #0F1B33; background: #F6F8FB; -webkit-font-smoothing: antialiased; overflow-x: clip; }
  h1, h2, h3, h4 { font-family: 'Figtree', system-ui, sans-serif; letter-spacing: -0.02em; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, .nav-link:focus-visible { outline: 3px solid rgba(249,106,10,.55); outline-offset: 2px; }

  /* ---------- Barre latérale ---------- */
  aside.app-sidebar {
    display: flex !important; flex-direction: column;
    position: fixed !important; top: 0; bottom: 0; left: 0; z-index: 60;
    width: 16.5rem !important; background: #fff !important; color: #0F1B33 !important;
    border-right: 1px solid #E2E8F0; overflow-y: auto;
    transition: transform .25s ease;
  }
  aside.app-sidebar .side-group { margin: 1.1rem 0 .35rem; padding: 0 .75rem; font-size: .75rem; font-weight: 700; color: #8592A8; }
  aside.app-sidebar .nav-link {
    position: relative; display: flex; align-items: center; gap: .75rem;
    padding: .6rem .75rem; border-radius: .65rem; cursor: pointer;
    font-size: .9rem; font-weight: 500; color: #44506A; background: transparent;
    transition: background-color .15s, color .15s;
  }
  aside.app-sidebar .nav-link i { font-size: 1.25rem; width: 1.25rem; text-align: center; color: #8592A8; transition: color .15s; }
  aside.app-sidebar .nav-link:hover { background: #F1F5F9; color: #0F1B33; }
  aside.app-sidebar .nav-link:hover i { color: #0B4AAE; }
  aside.app-sidebar .nav-link.active { background: #EAF1FC; color: #0B4AAE; font-weight: 700; }
  aside.app-sidebar .nav-link.active i { color: #0B4AAE; }
  aside.app-sidebar .nav-link.active::before { content: ""; position: absolute; left: -.75rem; top: .4rem; bottom: .4rem; width: 3px; border-radius: 0 3px 3px 0; background: #F96A0A; }
  aside.app-sidebar .nav-link.logout:hover { background: #FEF2F2; color: #B91C1C; }
  aside.app-sidebar .nav-link.logout:hover i { color: #B91C1C; }

  main.app-main { margin-left: 16.5rem !important; padding: 2rem 2.5rem 3rem !important; min-width: 0; }

  #mobile-bar { display: none; }
  #sidebar-overlay { display: none; }
  @media (max-width: 1023px) {
    aside.app-sidebar { transform: translateX(-100%); width: min(17rem, 86vw) !important; box-shadow: none; }
    aside.app-sidebar.open { transform: translateX(0); box-shadow: 0 20px 60px rgba(15,27,51,.3); }
    main.app-main { margin-left: 0 !important; padding: 4.75rem 1rem 2.5rem !important; }
    #mobile-bar { display: flex; position: fixed; top: 0; left: 0; right: 0; z-index: 50; height: 3.5rem; align-items: center; gap: .75rem; padding: 0 .75rem; background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border-bottom: 1px solid #E2E8F0; }
    #sidebar-overlay.show { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(15,27,51,.45); }
  }
  @media print {
    aside.app-sidebar, #mobile-bar, #sidebar-overlay { display: none !important; }
    main.app-main { margin-left: 0 !important; padding: 0 !important; }
  }

  /* ---------- Composants ---------- */
  .page-head { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
  @media (min-width: 768px) { .page-head { flex-direction: row; align-items: center; justify-content: space-between; } }
  .page-title { font-size: 1.6rem; font-weight: 800; line-height: 1.2; color: #0F1B33; }
  .page-sub { margin-top: .25rem; font-size: .9rem; color: #44506A; max-width: 44rem; line-height: 1.5; }
  .toolbar, .filters { display: flex; flex-wrap: wrap; gap: .5rem; }
  .filters { gap: .75rem; align-items: flex-end; }
  .lbl { display: block; margin-bottom: .3rem; font-size: .8rem; font-weight: 600; color: #44506A; }

  .field { padding: .55rem .8rem; border: 1px solid #CBD5E1; border-radius: .65rem; background: #fff; font-size: .9rem; color: #0F1B33; transition: border-color .15s, box-shadow .15s; }
  .field:focus { outline: none; border-color: #0B4AAE; box-shadow: 0 0 0 3px rgba(11,74,174,.13); }
  .field::placeholder { color: #94A3B8; }
  .field-md { min-width: 11rem; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; padding: .55rem .95rem; border-radius: .65rem; border: 1px solid transparent; font-size: .875rem; font-weight: 600; line-height: 1.25; white-space: nowrap; cursor: pointer; transition: background-color .15s, border-color .15s, color .15s; }
  .btn i { font-size: 1.1rem; }
  .btn-primary { background: #0B4AAE; color: #fff; } .btn-primary:hover { background: #083A8A; }
  .btn-dark { background: #0F1B33; color: #fff; } .btn-dark:hover { background: #1c2b4a; }
  .btn-light { background: #fff; color: #0F1B33; border-color: #CBD5E1; } .btn-light:hover { border-color: #0B4AAE; color: #0B4AAE; }
  .btn-excel { background: #fff; color: #0F1B33; border-color: #CBD5E1; } .btn-excel i { color: #059669; } .btn-excel:hover { background: #ECFDF5; border-color: #059669; }
  .btn-pdf { background: #fff; color: #0F1B33; border-color: #CBD5E1; } .btn-pdf i { color: #DC2626; } .btn-pdf:hover { background: #FEF2F2; border-color: #DC2626; }
  .link-back { display: inline-flex; align-items: center; gap: .4rem; margin-bottom: .6rem; font-size: .875rem; font-weight: 600; color: #0B4AAE; cursor: pointer; }
  .link-back:hover { text-decoration: underline; }

  .section-card { background: #fff; border: 1px solid #E2E8F0; border-radius: 1rem; box-shadow: none; }
  .card-title { display: flex; align-items: center; gap: .65rem; font-weight: 700; font-size: 1.05rem; margin-bottom: 1.1rem; }
  .card-title .ico { width: 2.25rem; height: 2.25rem; border-radius: .6rem; display: inline-flex; align-items: center; justify-content: center; font-size: 1.25rem; }
  .notice { display: flex; gap: .75rem; background: #EAF1FC; border: 1px solid #CFE0F7; color: #062C6B; border-radius: .85rem; padding: .85rem 1rem; font-size: .85rem; line-height: 1.55; margin-bottom: 1rem; }
  .notice > i { font-size: 1.3rem; color: #0B4AAE; flex-shrink: 0; margin-top: .05rem; }

  .data-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .data-table thead th { background: #F8FAFC; color: #44506A; font-size: .8rem; font-weight: 700; text-align: left; padding: .8rem 1rem; border-bottom: 1px solid #E2E8F0; white-space: nowrap; }
  .data-table tbody td { padding: .8rem 1rem; border-bottom: 1px solid #EEF2F6; vertical-align: middle; }
  .data-table tbody tr:last-child td { border-bottom: 0; }
  .data-table tbody tr:hover td { background: #F8FAFC; }
  .data-table thead.cashbook-head th { background: #0F1B33; color: #fff; border-bottom: 0; }
  .data-table thead.cashbook-head th.text-right { text-align: right; }
  .data-table thead.cashbook-head th i { opacity: .85; }


  /* Recherche rapide d'élève (liste déroulante) */
  .student-search-wrap { position: relative; }
  .student-search-results { position: absolute; top: 100%; left: 0; right: 0; z-index: 30; margin-top: .35rem; max-height: 20rem; overflow-y: auto; background: #fff; border: 1px solid #E2E8F0; border-radius: .85rem; box-shadow: 0 18px 40px -16px rgba(15,27,51,.25); }
  .student-search-results > * { padding: .65rem .9rem; cursor: pointer; border-bottom: 1px solid #F1F5F9; }
  .student-search-results > *:last-child { border-bottom: 0; }
  .student-search-results > *:hover { background: #F8FAFC; }

  /* Bandeau d'usurpation (affiché par le script) */
  #impersonation-banner { position: relative; z-index: 70; }
  @media (min-width: 1024px) { #impersonation-banner:not(.hidden) { margin-left: 16.5rem; } }
  @media (max-width: 1023px) { #impersonation-banner:not(.hidden) { margin-top: 3.5rem; } }

  @media (max-width: 640px) {
    .page-title { font-size: 1.35rem; }
    .filters > div, .filters > .btn { flex: 1 1 100%; }
    .filters .field { width: 100%; }
    .filters .btn { width: 100%; }
    .toolbar .btn { flex: 1 1 auto; }
  }

  /* ---------- Cartes de chiffres, pastilles de statut, actions de tableau (utilisées par les scripts) ---------- */
  .stat-card { background: #fff; border: 1px solid #E2E8F0; border-radius: 1rem; padding: 1.1rem 1.15rem; min-width: 0; }
  .stat-top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .75rem; }
  .stat-label { font-size: .82rem; font-weight: 600; color: #44506A; }
  .stat-ico { width: 2.1rem; height: 2.1rem; border-radius: .6rem; display: inline-flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0; }
  .stat-value { font-size: 1.5rem; font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; color: #0F1B33; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .badge { display: inline-flex; align-items: center; gap: .3rem; padding: .2rem .6rem; border-radius: 999px; font-size: .75rem; font-weight: 700; line-height: 1.3; white-space: nowrap; }
  .badge-blue { background: #EAF1FC; color: #083A8A; }
  .badge-green { background: #ECFDF5; color: #047857; }
  .badge-red { background: #FEF2F2; color: #B91C1C; }
  .badge-gray { background: #F1F5F9; color: #44506A; }
  .badge-amber, .badge-yellow, .badge-orange { background: #FFF0E5; color: #B45309; }
  .badge-purple, .badge-indigo { background: #F3F0FF; color: #5B21B6; }
  .act { display: inline-flex; align-items: center; gap: .35rem; padding: .35rem .65rem; border-radius: .55rem; font-size: .8rem; font-weight: 600; cursor: pointer; transition: background-color .15s; }
  .act i { font-size: 1rem; }
  .act-blue { color: #0B4AAE; } .act-blue:hover { background: #EAF1FC; }
  .act-red { color: #B91C1C; } .act-red:hover { background: #FEF2F2; }
  .act-green { color: #047857; } .act-green:hover { background: #ECFDF5; }
</style>
</head>

  const sidebar = document.getElementById('app-sidebar')
  const overlay = document.getElementById('sidebar-overlay')
  const sbToggle = document.getElementById('sidebar-toggle')
  function setSidebar(open) {
    sidebar.classList.toggle('open', open)
    overlay.classList.toggle('show', open)
    sbToggle.setAttribute('aria-expanded', String(open))
  }
  sbToggle.addEventListener('click', () => setSidebar(!sidebar.classList.contains('open')))
  overlay.addEventListener('click', () => setSidebar(false))
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setSidebar(false) })
  sidebar.addEventListener('click', e => { if (e.target.closest('.nav-link')) setSidebar(false) })
  sidebar.addEventListener('keydown', e => {
    const link = e.target.closest('.nav-link')
    if (link && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); link.click() }

<script src="/static/js/api.js?v=10"></script>
<script>
async function init() {
  const data = await guardAuth(['enseignant'])
  if (!data) return
  document.getElementById('user-info').innerHTML = `<i class="ph ph-user-circle mr-1 align-middle text-base"></i>${escapeHtml(data.user.name)}`
  document.getElementById('school-name-label').textContent = data.school ? data.school.name : 'École'

  // Pas de route dédiée listant les classes de l'enseignant : réutilisation de /api/admin non permise (rôle),
  // on utilise donc une agrégation simple côté shared si besoin. Pour l'instant on affiche un message informatif.
  document.getElementById('classes-container').innerHTML = `
    <div class="section-card md:col-span-2 text-center px-6 py-12">
      <span class="w-14 h-14 rounded-full bg-brand-soft text-brand inline-flex items-center justify-center text-3xl mb-4"><i class="ph ph-info"></i></span>
      <p class="font-semibold">Le module de consultation détaillée des classes pour les enseignants sera bientôt disponible.</p>
      <p class="text-sm text-ink-soft mt-2 max-w-md mx-auto">Contactez l'administrateur de votre école pour toute information sur vos classes affectées.</p>
    </div>`
}
init()
</script>
